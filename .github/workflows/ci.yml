# CI Clai — gerbang Bab 3/8 PRD versi yang benar-benar dijalankan
# (Sapuan Kepatuhan pra-1.0.0, temuan D-02): analisis statis + seluruh uji +
# laporan cakupan pada setiap push & pull request. Berkas ini bagian dari
# pohon repo lokal; aktif begitu kode di-push ke GitHub (izin pemilik).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Ambil dependensi
        run: flutter pub get
      - name: Analisis statis (nol error adalah gerbang)
        run: flutter analyze
      - name: Seluruh uji + cakupan
        run: flutter test --coverage
      - name: Simpan laporan cakupan
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: app/coverage/lcov.info
