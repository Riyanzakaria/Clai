name: clai
description: "Clai — an open-source music player for Android. No account, no ads, no telemetry: your library, playlists, and listening history live only on your phone."
publish_to: 'none'
version: 2.0.0+8053

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  just_audio: ^0.10.4
  audio_service: ^0.18.17
  audio_session: ^0.2.0
  dio: ^5.9.0
  crypto: ^3.0.7
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  google_fonts: ^6.3.2
  uuid: ^4.5.1
  share_plus: ^11.1.0
  webview_flutter: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  generate: true
  fonts:
    # Font tampilan (keputusan pemilik 2026-11-10, staging 8049): Clash
    # Display menggantikan Space Grotesk. Bukan Google Fonts — dibundel
    # dari Fontshare/ITF (lisensi Free Font, lihat assets/fonts/README.md).
    - family: Clash Display
      fonts:
        - asset: assets/fonts/ClashDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/ClashDisplay-Semibold.ttf
          weight: 600
        - asset: assets/fonts/ClashDisplay-Bold.ttf
          weight: 700
  assets:
    - assets/logo/
    # Solver EJS (yt-dlp-ejs 0.8.0: ejs_lib.min.js + ejs_core.min.js) — hanya
    # dimuat Lab PoToken diagnostik (Tahap 2 Mesin Penyeberangan 2.0).
    - assets/solver/
